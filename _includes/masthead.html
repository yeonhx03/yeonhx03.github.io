{% capture logo_path %}{{ site.logo }}{% endcapture %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="주요 메뉴">
        <a class="site-title" href="{{ '/' | relative_url }}">
          {% unless logo_path == empty %}
            <img src="{{ logo_path | relative_url }}" alt="" class="site-logo">
          {% endunless %}
          {{ site.title }}
        </a>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        {% if site.search == true %}
          <button class="search__toggle" type="button">
            <span class="visually-hidden">Toggle search</span>
            <i class="fas fa-search"></i>
          </button>
        {% endif %}
        <button class="greedy-nav__toggle hidden" type="button" aria-label="메뉴 열기">
          <span class="visually-hidden">메뉴 열기</span>
          <div class="navicon"></div>
        </button>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
