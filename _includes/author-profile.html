{% assign author = site.author %}
<div class="author__avatar">
  {% if author.avatar %}
    <a href="{{ '/about/' | relative_url }}" aria-label="About">
      <img src="{{ author.avatar | relative_url }}" alt="{{ author.name | default: site.title }}">
    </a>
  {% endif %}
</div>
