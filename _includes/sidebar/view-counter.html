<div class="sidebar-views" aria-label="Total visits">
  <span class="sidebar-views__label">Total visits</span>
  <strong
    class="sidebar-views__count"
    data-goatcounter-code="{{ site.github_username }}"
  >--</strong>
</div>

{% if site.github_username %}
  <div class="sidebar-github-grass">
    <a
      class="sidebar-github-grass__link"
      href="https://github.com/{{ site.github_username }}"
      aria-label="{{ site.github_username }} GitHub contributions"
      rel="noopener noreferrer"
      target="_blank"
    >
      <img
        src="https://ghchart.rshah.org/449044/{{ site.github_username }}"
        alt="{{ site.github_username }} GitHub contribution graph"
        loading="lazy"
      >
    </a>
  </div>
{% endif %}
