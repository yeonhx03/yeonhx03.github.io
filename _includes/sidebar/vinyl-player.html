<div class="vinyl-player">
    <button
        class="vinyl-player__button"
        type="button"
        aria-label="음악 재생"
        aria-pressed="false"
    >
        <img
            class="vinyl-player__record"
            src="/assets/images/vinyl-record.svg"
            alt=""
            width="80"
            height="80"
            aria-hidden="true"
            decoding="async"
            draggable="false"
        >
    </button>
    <label class="vinyl-player__volume" for="vinyl-player-volume">
        <span class="visually-hidden">볼륨</span>
        <input
            class="vinyl-player__volume-control"
            id="vinyl-player-volume"
            type="range"
            min="0"
            max="100"
            value="70"
            aria-label="볼륨"
            aria-valuetext="70%"
        >
        <span class="vinyl-player__volume-bar" aria-hidden="true">
            <span class="vinyl-player__volume-fill"></span>
            <span class="vinyl-player__volume-thumb"></span>
        </span>
    </label>
</div>
