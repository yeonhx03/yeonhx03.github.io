title: "공부해라 도현아"
name: "yeonhx03"
description: "공부 기록"
url: "https://yeonhx03.github.io"
repository: "yeonhx03/yeonhx03.github.io"
github_username: "yeonhx03"

minimal_mistakes_skin: "default"
remote_theme: "mmistakes/minimal-mistakes@4.28.0"

search: true
search_full_content: true

markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Seoul
locale: ko-KR

include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "yeonhx03"
  avatar: "/assets/images/bio-photo.jpg"
  bio: ""

footer:
  links: []

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      show_date: true
      share: false
      related: false
      toc: true
      toc_sticky: true
      comments: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Music player script is paused until a better playback approach is chosen.
after_footer_scripts: []
# Re-enable by adding the music player script here.
